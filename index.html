<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leads Dormants → Rendez-vous</title>
<meta name="description" content="Le système de 6 relances pour les prestataires B2B qui veulent mieux exploiter leurs leads déjà acquis.">
<style>
/* =========================================================
   DESIGN TOKENS — "nuit + crème"
========================================================= */
:root{
  --bg:#0a0c12;
  --bg-2:#0e1119;
  --surface:#141826;
  --surface-2:#1b2032;
  --surface-3:#232941;
  --border:#2a3049;
  --border-soft:#1f2436;
  --text:#f3ead9;
  --text-dim:#c9c0ac;
  --text-faint:#8b8a97;
  --accent:#d8b06a;
  --accent-strong:#e7c988;
  --accent-ink:#241a08;
  --sage:#8aa896;
  --danger:#d97b62;
  --danger-strong:#e69682;
  --success:#8fbf9a;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-soft:0 10px 30px rgba(0,0,0,.35);
  --shadow-tiny:0 2px 8px rgba(0,0,0,.25);
  --maxw:1180px;
  --nav-h:64px;
  --tabbar-h:64px;
  font-size:16px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
}
@media (min-width:900px){ body{ padding-bottom:24px; } }
h1,h2,h3,h4,p,ul,figure{margin:0;}
img{max-width:100%;display:block;}
button{font-family:inherit;}
a{color:var(--accent-strong);}
::selection{background:var(--accent);color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:6px;}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* =========================================================
   LAYOUT
========================================================= */
#app{max-width:var(--maxw);margin:0 auto;padding:16px;padding-top:calc(var(--nav-h) + env(safe-area-inset-top) + 16px);}
@media (min-width:900px){ #app{padding:24px 32px;padding-top:calc(var(--nav-h) + env(safe-area-inset-top) + 28px);} }

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  height:calc(var(--nav-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  box-sizing:border-box;
  background:rgba(10,12,18,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;}
@media (min-width:900px){ .topbar-inner{padding:0 32px;} }
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);text-decoration:none;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--sage));flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink);font-size:.9rem;}
.brand-text{display:none;}
@media (min-width:640px){ .brand-text{display:inline;} }

.topnav{display:none;gap:4px;}
@media (min-width:760px){ .topnav{display:flex;} }
.topnav button{
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  padding:9px 14px;border-radius:999px;font-size:.88rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .15s,color .15s;
}
.topnav button:hover{background:var(--surface-2);color:var(--text);}
.topnav button.active{background:var(--surface-2);color:var(--accent-strong);border-color:var(--border);}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  box-sizing:border-box;
  background:rgba(14,17,25,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);
  display:flex;
}
@media (min-width:760px){ .tabbar{display:none;} }
.tabbar button{
  flex:1;background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.68rem;font-weight:600;cursor:pointer;min-height:44px;padding:6px 2px;
}
.tabbar button .ic{font-size:1.15rem;line-height:1;}
.tabbar button.active{color:var(--accent-strong);}

/* =========================================================
   COMPONENTS
========================================================= */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.btn-ghost-sm{
  background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:999px;
  padding:7px 13px;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:36px;
}
.btn-ghost-sm:hover{background:var(--surface-2);color:var(--text);}

h1.page-title{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;color:var(--text);}
@media (min-width:760px){ h1.page-title{font-size:1.85rem;} }
p.page-sub{color:var(--text-dim);margin-top:6px;font-size:.95rem;max-width:60ch;}

.card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-tiny);
}
.card + .card{margin-top:14px;}
.card-title{font-size:1.05rem;font-weight:700;margin-bottom:4px;}
.card-sub{color:var(--text-dim);font-size:.86rem;margin-bottom:14px;}
.grid{display:grid;gap:14px;}
@media (min-width:680px){ .grid.cols-2{grid-template-columns:1fr 1fr;} }
@media (min-width:900px){ .grid.cols-3{grid-template-columns:repeat(3,1fr);} .grid.cols-4{grid-template-columns:repeat(4,1fr);} }

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;
  padding:13px 22px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:46px;
  transition:transform .1s,filter .15s;width:auto;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.block{width:100%;}
.btn.secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--danger);color:#2a0f08;}
.btn.sm{padding:9px 15px;min-height:38px;font-size:.85rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-link{background:none;border:none;color:var(--accent-strong);font-weight:700;cursor:pointer;padding:8px 4px;font-size:.9rem;}

.stack{display:flex;flex-direction:column;gap:10px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

label.field-label{display:block;font-size:.83rem;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
.field{margin-bottom:16px;}
.hint{font-size:.78rem;color:var(--text-faint);margin-top:5px;}
.err{font-size:.8rem;color:var(--danger-strong);margin-top:5px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=email],textarea,select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;font-family:inherit;min-height:46px;
}
textarea{min-height:90px;resize:vertical;}
input.invalid,select.invalid,textarea.invalid{border-color:var(--danger-strong);}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
  padding:9px 14px;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:40px;
}
.chip.selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border);}
.badge.high{background:rgba(216,176,106,.18);color:var(--accent-strong);border-color:rgba(216,176,106,.35);}
.badge.mid{background:rgba(138,168,150,.18);color:var(--sage);border-color:rgba(138,168,150,.35);}
.badge.low{background:var(--surface-3);color:var(--text-faint);}
.badge.demo{background:rgba(217,123,98,.18);color:var(--danger-strong);border-color:rgba(217,123,98,.35);}

.progressbar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.progressbar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:999px;transition:width .3s;}

.stepper{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;}
.step-pill{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-faint);font-size:.82rem;font-weight:700;cursor:pointer;min-height:40px;
}
.step-pill .num{width:20px;height:20px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:.7rem;}
.step-pill.done{color:var(--sage);border-color:rgba(138,168,150,.4);}
.step-pill.done .num{background:var(--sage);color:#0e1911;}
.step-pill.current{color:var(--accent-strong);border-color:var(--accent);background:var(--surface-2);}
.step-pill.current .num{background:var(--accent);color:var(--accent-ink);}

.empty-state{text-align:center;padding:36px 18px;color:var(--text-dim);}
.empty-state .ic{font-size:2rem;margin-bottom:10px;}
.empty-state p{max-width:42ch;margin:0 auto;}

.lead-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}
.lead-card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.lead-card h3{font-size:1rem;font-weight:700;}
.lead-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.lead-meta span{font-size:.75rem;color:var(--text-faint);background:var(--surface-3);padding:3px 9px;border-radius:999px;}
.lead-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

table.data-table{width:100%;border-collapse:collapse;font-size:.86rem;}
table.data-table th,table.data-table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border-soft);}
table.data-table th{color:var(--text-faint);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;}
.table-wrap{overflow-x:auto;}
@media (max-width:760px){ .table-wrap.responsive-cards table{display:none;} }
.mobile-cards{display:block;}
@media (min-width:760px){ .mobile-cards{display:none;} }

.msg-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.msg-card .day-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);padding:4px 12px;border-radius:999px;font-weight:800;font-size:.78rem;}
.msg-body{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:14px;margin:12px 0;white-space:pre-wrap;font-size:.92rem;line-height:1.6;}
.msg-meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.why-box{font-size:.82rem;color:var(--text-dim);background:var(--surface-3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(6,7,11,.72);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;}
@media (min-width:640px){ .modal-overlay{align-items:center;padding:20px;} }
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-soft);}
@media (min-width:640px){ .modal-box{border-radius:var(--radius-lg);} }
.modal-box h2{font-size:1.2rem;font-weight:800;margin-bottom:10px;}
.modal-close{position:sticky;top:0;float:right;background:var(--surface-2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;color:var(--text);font-size:1rem;cursor:pointer;}

.toast-container{position:fixed;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 16px;}
@media (min-width:760px){ .toast-container{bottom:20px;} }
.toast{background:var(--surface-3);color:var(--text);border:1px solid var(--border);padding:11px 20px;border-radius:999px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow-soft);max-width:92vw;}

.onboard-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;}
.onboard-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 24px;max-width:520px;margin:0 auto;}
.onboard-dots{display:flex;gap:6px;margin:20px 0;}
.onboard-dots span{width:7px;height:7px;border-radius:50%;background:var(--surface-3);}
.onboard-dots span.active{background:var(--accent);}
.onboard-foot{padding:20px 24px calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:10px;max-width:520px;margin:0 auto;width:100%;}

.pipeline-cols{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
.pipeline-col{flex:0 0 260px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:12px;}
@media (max-width:760px){ .pipeline-cols{flex-direction:column;overflow-x:visible;} .pipeline-col{flex:1 1 auto;} }
.pipeline-col h3{font-size:.86rem;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;color:var(--text-dim);}
.pipeline-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;font-size:.84rem;}
.pipeline-card .pv{color:var(--accent-strong);font-weight:700;}

.section-heading{font-size:1.15rem;font-weight:800;margin:24px 0 12px;}
.section-heading:first-child{margin-top:0;}

.tooltip-icon{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--surface-3);color:var(--text-faint);font-size:.68rem;font-weight:800;cursor:help;border:1px solid var(--border);}

.kv-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:.9rem;}
.kv-line:last-child{border-bottom:none;}
.kv-line .k{color:var(--text-dim);}
.kv-line .v{font-weight:700;text-align:right;}

.checklist-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent);}
.checklist-item label{font-size:.92rem;cursor:pointer;}

.result-hero{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 22px;text-align:center;}
.result-hero h1{font-size:1.5rem;font-weight:800;}
@media (min-width:760px){ .result-hero h1{font-size:1.9rem;} }

.today-actions{list-style:none;padding:0;margin:0;counter-reset:ta;}
.today-actions li{counter-increment:ta;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.today-actions li:last-child{border-bottom:none;}
.today-actions li::before{content:counter(ta);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;}

.bonus-card{display:flex;flex-direction:column;gap:10px;}
.bonus-card .ic{font-size:1.8rem;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);display:inline-block;}
.status-dot.on{background:var(--success);}

.template-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px;}
.template-card .cat-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;}

.filters-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.filters-bar select,.filters-bar input{width:auto;min-width:140px;flex:1 1 140px;}

.copybtn.copied{background:var(--success);color:#0e1911;}

/* print */
@media print{
  .topbar,.tabbar,.stepper,.actions-row,.no-print,.btn,.toast-container,.modal-overlay,.filters-bar{display:none !important;}
  body{background:#fff;color:#111;padding:0;}
  #app{max-width:100%;padding:0;}
  .card{background:#fff;border:1px solid #ccc;box-shadow:none;color:#111;break-inside:avoid;}
  .msg-body{background:#f7f7f7;border-color:#ccc;color:#111;}
  h1,h2,h3,.card-title{color:#111;}
  .kv-line,.card-sub,.why-box{color:#333;}
  a{color:#111;text-decoration:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>

<a href="#home" class="visually-hidden">Aller au contenu principal</a>
<header class="topbar no-print">
  <div class="topbar-inner">
    <a href="#home" class="brand"><span class="brand-mark">LD</span><span class="brand-text">Leads Dormants</span></a>
    <nav class="topnav" aria-label="Navigation principale">

</header>

<main id="app" role="main"></main>

<nav class="tabbar no-print" aria-label="Navigation mobile">
  <button type="button" data-nav="home"><span class="ic">🏠</span>Accueil</button>
  <button type="button" data-nav="system"><span class="ic">🧭</span>Système</button>
  <button type="button" data-nav="bonus"><span class="ic">🎁</span>Bonus</button>
  <button type="button" data-nav="exports"><span class="ic">📤</span>Export</button>
</nav>

<div id="toast-container" class="toast-container no-print" aria-live="polite" aria-atomic="true"></div>

<script>
(function(){
"use strict";

/* =========================================================
   UTILS
========================================================= */
const Utils = {
  uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); },
  clamp(n,min,max){ return Math.min(max,Math.max(min,n)); },
  clampPercent(n){ return Utils.clamp(Utils.toNumber(n),0,100); },
  toNumber(v){
    if(v===null||v===undefined||v==='') return 0;
    if(typeof v==='number') return isFinite(v)?v:0;
    let s=String(v).trim().replace(/\s/g,'').replace(/€/g,'').replace(',', '.');
    let n=parseFloat(s);
    return isFinite(n)?n:0;
  },
  money(n){
    n=Utils.toNumber(n);
    try{ return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n); }
    catch(e){ return n+' €'; }
  },
  number(n){
    try{ return new Intl.NumberFormat('fr-FR').format(Utils.toNumber(n)); }
    catch(e){ return String(n); }
  },
  escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  },
  nl2br(str){ return Utils.escapeHtml(str).replace(/\n/g,'<br>'); },
  formatDate(ts){
    if(!ts) return '—';
    try{
      const d = typeof ts==='number'||/^\d+$/.test(ts) ? new Date(Number(ts)) : new Date(ts);
      if(isNaN(d.getTime())) return '—';
      return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
    }catch(e){ return '—'; }
  },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  daysBetween(iso){
    if(!iso) return null;
    const d = new Date(iso);
    if(isNaN(d.getTime())) return null;
    const diff = Date.now() - d.getTime();
    return Math.floor(diff/86400000);
  },
  daysUntil(iso){
    if(!iso) return null;
    const d = new Date(iso);
    if(isNaN(d.getTime())) return null;
    const diff = d.getTime() - new Date(new Date().toDateString()).getTime();
    return Math.round(diff/86400000);
  },
  async downloadFile(filename, content, mime){
    const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
    if(window.claude && typeof window.claude.use==='function'){
      try{
        const downloads = await window.claude.use('downloads');
        if(downloads){
          await downloads.save({filename, data: blob});
          return true;
        }
      }catch(e){
        return false;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    return true;
  },
  async copyText(text){
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){ /* fall through to fallback */ }
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  },
  csvEscape(v){
    v = v===null||v===undefined?'':String(v);
    if(/[",;\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  },
  debounce(fn,wait){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),wait); }; },
  getPath(obj,path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); },
  setPath(obj,path,value){
    const parts = path.split('.');
    let cur = obj;
    for(let i=0;i<parts.length-1;i++){
      if(cur[parts[i]]==null || typeof cur[parts[i]]!=='object') cur[parts[i]]={};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length-1]] = value;
  }
};

const SCHEMA_VERSION = 1;
const APP_VERSION = '1.0.0';
const STORAGE_KEY = 'leadsDormants.state.v1';

function defaultState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    onboardingSeen: false,
    profil: {
      entreprise:'', offre:'', prixOffre:'', typeProspect:'', resultatOffre:'',
      sourcesLeads:[], cycleVente:'', canaux:[], objections:[], ton:'', objectifPrincipal:''
    },
    leads: [],
    quickInventory: {actif:false, total:'', jamaisRelance:'', relanceUne:'', reflexion:'', recontacterPlusTard:'', froid:''},
    sequence: null,
    sourceSnapshot: null,
    calculator: {leads:'', valeurMoyenne:'', tauxQualifies:'', tauxConversion:'', savedAt:null},
    checklist: {checked:{}, savedAt:null},
    bonusProgress: {calculator:false, library:false, pipeline:false, objections:false, checklist:false},
    notes:'',
    demo:false
  };
}

const Storage = {
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || typeof parsed!=='object' || !('schemaVersion' in parsed)) return null;
      return Storage.migrate(parsed);
    }catch(e){
      console.warn('Données locales corrompues, réinitialisation prudente.', e);
      return null;
    }
  },
  migrate(data){
    const base = defaultState();
    const merged = Object.assign({}, base, data);
    merged.profil = Object.assign({}, base.profil, data.profil||{});
    merged.quickInventory = Object.assign({}, base.quickInventory, data.quickInventory||{});
    merged.calculator = Object.assign({}, base.calculator, data.calculator||{});
    merged.checklist = Object.assign({}, base.checklist, data.checklist||{});
    merged.bonusProgress = Object.assign({}, base.bonusProgress, data.bonusProgress||{});
    merged.leads = Array.isArray(data.leads) ? data.leads : [];
    merged.schemaVersion = SCHEMA_VERSION;
    return merged;
  },
  save(state){
    try{
      state.updatedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    }catch(e){
      console.warn('Sauvegarde impossible', e);
      UI.toast("Sauvegarde impossible (stockage plein ou indisponible).");
      return false;
    }
  },
  clear(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} },
  isValidImport(obj){
    return obj && typeof obj==='object' && ('profil' in obj) && ('leads' in obj) && Array.isArray(obj.leads);
  }
};

    const loaded = Storage.load();
    if(loaded){ this.data = loaded; hadExistingSession = true; }

  get(){ return this.data; },
  save(){ Storage.save(this.data); },

};

      b.addEventListener('click', ()=>{ if(a.onClick) a.onClick(); if(a.close!==false) UI.closeModal(); });
      actionsWrap.appendChild(b);
    });
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) UI.closeModal(); });
    document.addEventListener('keydown', UI._escHandler = (e)=>{ if(e.key==='Escape') UI.closeModal(); });
    const focusable = box.querySelector('button, input, textarea, select');
    if(focusable) focusable.focus();
  },
  closeModal(){
    document.getElementById('modal-root').innerHTML = '';
    if(UI._escHandler) document.removeEventListener('keydown', UI._escHandler);
  },
  confirm({title, message, confirmLabel, danger, onConfirm}){
    UI.modal({

      bodyHtml: '<p style="color:var(--text-dim);font-size:.92rem;">'+Utils.escapeHtml(message)+'</p>',

        {label: confirmLabel||'Confirmer', className: danger?'danger':'', onClick:onConfirm}
      ]
    });

};

/* =========================================================
   LEAD MANAGER
========================================================= */
const LeadManager = {
  add(data){
    const st = StateM.get();
    const lead = Object.assign({
      id: Utils.uid(),
      nom:'', source:'Autre', valeur:'', dernierContact:'', statut:'Nouveau',
      derniereInteraction:'', objection:'', prochaineAction:'', echeance:'', notes:'',
      createdAt: Date.now(), updatedAt: Date.now()
    }, data);
    st.leads.unshift(lead);
    StateM.save();
    return lead;
  },
  update(id, data){
    const st = StateM.get();
    const lead = st.leads.find(l=>l.id===id);
    if(!lead) return;
    Object.assign(lead, data, {updatedAt:Date.now()});
    StateM.save();
  },
  remove(id){
    const st = StateM.get();
    st.leads = st.leads.filter(l=>l.id!==id);
    StateM.save();
  },
  duplicate(id){
    const st = StateM.get();
    const lead = st.leads.find(l=>l.id===id);
    if(!lead) return;
    const copy = Object.assign({}, lead, {id:Utils.uid(), nom: lead.nom + ' (copie)', createdAt:Date.now(), updatedAt:Date.now()});
    st.leads.unshift(copy);
    StateM.save();
  },
  score(lead){
    let total = 0;
    const days = Utils.daysBetween(lead.dernierContact);
    if(days!==null){
      if(days<=3) total+=3; else if(days<=7) total+=2; else if(days<=14) total+=1;
    }
    const val = Utils.toNumber(lead.valeur);
    if(val>=5000) total+=3; else if(val>=2000) total+=2; else if(val>0) total+=1;
    const statutScore = {'Rendez-vous fixé':4,'En échange':3,'À relancer':3,'Réflexion':2,'Contacté':2,'Nouveau':1,'Pas maintenant':0,'Non prioritaire':-1};
    total += (statutScore[lead.statut]!==undefined?statutScore[lead.statut]:0);
    if(lead.objection==='Pas de réponse') total -= 1;
    const until = Utils.daysUntil(lead.echeance);
    if(until!==null){ if(until<=0) total+=2; else if(until<=7) total+=1; }
    if(total>=7) return {label:'Priorité haute', cls:'high'};
    if(total>=4) return {label:'Priorité moyenne', cls:'mid'};
    return {label:'À réévaluer', cls:'low'};
  },
  filtered(state, filters){
    let list = state.leads.slice();
    if(filters.search){
      const q = filters.search.toLowerCase();
      list = list.filter(l=> (l.nom||'').toLowerCase().includes(q) || (l.notes||'').toLowerCase().includes(q));
    }
    if(filters.statut) list = list.filter(l=>l.statut===filters.statut);
    if(filters.source) list = list.filter(l=>l.source===filters.source);
    if(filters.sort==='valeur-desc') list.sort((a,b)=>Utils.toNumber(b.valeur)-Utils.toNumber(a.valeur));
    else if(filters.sort==='valeur-asc') list.sort((a,b)=>Utils.toNumber(a.valeur)-Utils.toNumber(b.valeur));
    else if(filters.sort==='recent') list.sort((a,b)=> new Date(b.dernierContact||0) - new Date(a.dernierContact||0));
    else if(filters.sort==='priorite'){
      const rank = {high:0,mid:1,low:2};
      list.sort((a,b)=> rank[LeadManager.score(a).cls]-rank[LeadManager.score(b).cls]);
    }
    return list;
  }
};

/* =========================================================
   SEQUENCE GENERATOR
========================================================= */
const SequenceGenerator = {
  pickCanal(profil, index){
    if(profil.canaux && profil.canaux.length) return profil.canaux[index % profil.canaux.length];
    return 'Email';
  },
  buildMessage(day, profil, variantIndex){
    const tone = profil.ton || 'Consultatif';
    const open = TONE_OPEN[tone] || TONE_OPEN['Consultatif'];
    const close = TONE_CLOSE[tone] || TONE_CLOSE['Consultatif'];
    let bodies;
    if(day==='J7'){
      const obj = (profil.objections && profil.objections[0]) || 'Autre';
      bodies = OBJECTION_MSGS[obj] || OBJECTION_MSGS['Autre'];
    } else {
      bodies = DAY_BODIES[day];
    }
    const idx = ((variantIndex||0) % bodies.length + bodies.length) % bodies.length;
    let body = bodies[idx];
    if(tone==='Très concis'){
      body = body.split('. ')[0] + (body.includes('.')?'.':'');
    }
    return open + '\n\n' + body + '\n\n' + close + '\n[Prénom]';
  },
  buildCard(day, profil, index, variantIndex){
    return {
      day,
      objectif: DAY_META[day].but,
      canal: SequenceGenerator.pickCanal(profil, index),
      message: SequenceGenerator.buildMessage(day, profil, variantIndex||0),
      pourquoi: DAY_META[day].but,
      alternative: ALT_SHORT[day],
      notes:'',
      manuallyEdited:false,
      variantIndex: variantIndex||0
    };
  },
  generate(profil){
    const seq = {generatedAt: Date.now()};
    DAY_KEYS.forEach((day,i)=>{ seq[day] = SequenceGenerator.buildCard(day, profil, i, 0); });
    return seq;
  },
  regenerateStep(state, day){
    const seq = state.sequence;
    if(!seq) return;
    const card = seq[day];
    const nextVariant = (card.variantIndex||0) + 1;
    const fresh = SequenceGenerator.buildCard(day, state.profil, DAY_KEYS.indexOf(day), nextVariant);
    fresh.notes = card.notes;
    seq[day] = fresh;
    StateM.save();
  },
  snapshot(profil){
    return JSON.stringify({offre:profil.offre, prixOffre:profil.prixOffre, typeProspect:profil.typeProspect, objections:profil.objections, canaux:profil.canaux, ton:profil.ton, objectifPrincipal:profil.objectifPrincipal});
  },
  isStale(state){
    if(!state.sequence || !state.sourceSnapshot) return false;
    return SequenceGenerator.snapshot(state.profil) !== state.sourceSnapshot;
  }
};

/* =========================================================
   CALCULATOR
========================================================= */
const Calculator = {
  compute(inputs){
    const leads = Math.max(0, Math.round(Utils.toNumber(inputs.leads)));
    const valeurMoyenne = Math.max(0, Utils.toNumber(inputs.valeurMoyenne));
    const tauxQualifies = Utils.clampPercent(inputs.tauxQualifies);
    const tauxConversion = Utils.clampPercent(inputs.tauxConversion);
    function scenario(mult){
      const qualifies = leads * (tauxQualifies/100) * mult;
      const ventes = qualifies * (tauxConversion/100);
      const ca = ventes * valeurMoyenne;
      return {qualifies, ventes, ca};
    }
    return {
      prudent: scenario(0.7),
      median: scenario(1),
      ambitieux: scenario(1.3)
    };
  }
};

========================================================= */
const ROUTES = ['home','leads','offer','sequence','results','bonus','bonus-calculator','bonus-library','bonus-pipeline','bonus-objections','bonus-checklist','exports'];
let previousHash = 'home';
let currentHash = 'home';

function nextIncompleteRoute(){
  const st = StateM.get();
  const hasLeads = st.leads.length>0 || Utils.toNumber(st.quickInventory.total)>0;
  if(!hasLeads) return 'leads';
  if(!st.profil.offre || !st.profil.prixOffre || !st.profil.typeProspect) return 'offer';
  if(!st.sequence) return 'sequence';
  return 'results';
}

function navigate(hash){
  try{ location.hash = '#' + hash; }catch(e){ /* ignore, route() below still runs */ }
  // Never rely solely on the 'hashchange' event: some hosting/preview contexts
  // can leave that listener unregistered if an earlier step failed. Driving
  // route() directly here means every navigation click still renders.
  route();
}

function route(){
  let hash = (location.hash || '#home').replace('#','');
  if(hash==='system'){
    hash = nextIncompleteRoute();
    try{ history.replaceState(null, '', '#' + hash); }catch(e){ /* non-fatal */ }
  }
  if(!ROUTES.includes(hash)) hash = 'home';
  previousHash = currentHash;
  currentHash = hash;
  renderRoute(hash);
  updateNavActive(hash);
  try{ window.scrollTo(0,0); }catch(e){ /* non-fatal */ }
}

function updateNavActive(hash){
  const group = (['leads','offer','sequence','results'].includes(hash)) ? 'system'
    : (hash.startsWith('bonus')) ? 'bonus'
    : (hash==='exports') ? 'exports'
    : 'home';
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.nav===group);
  });
}

function progressGlobal(state){
  const hasLeads = state.leads.length>0 || Utils.toNumber(state.quickInventory.total)>0;
  const hasOffer = !!(state.profil.offre && state.profil.prixOffre && state.profil.typeProspect);
  const hasSeq = !!state.sequence;
  const hasPlan = hasSeq && hasOffer;
  const done = [hasLeads,hasOffer,hasSeq,hasPlan].filter(Boolean).length;
  return Math.round(done/4*100);
}

function buildPlanText(){
  const st = StateM.get();
  const p = st.profil;
  let out = 'LEADS DORMANTS → RENDEZ-VOUS\n\n';
  out += 'Entreprise : '+(p.entreprise||'—')+'\n';
  out += 'Offre : '+(p.offre||'—')+'\n';
  out += 'Prix : '+(p.prixOffre?Utils.money(p.prixOffre):'—')+'\n';
  out += 'Prospect type : '+(p.typeProspect||'—')+'\n';
  out += 'Sources : '+((p.sourcesLeads||[]).join(', ')||'—')+'\n';
  out += 'Cycle : '+(p.cycleVente||'—')+'\n';
  out += 'Objections : '+((p.objections||[]).join(', ')||'—')+'\n\n';
  out += 'SÉQUENCE J0-J30\n\n';
  if(st.sequence){
    DAY_KEYS.forEach(day=>{
      const c = st.sequence[day];
      out += day+'\n';
      out += 'Objectif : '+c.objectif+'\n';
      out += 'Canal : '+c.canal+'\n';
      out += 'Message :\n'+c.message+'\n\n';
    });
  }
  out += 'PROCHAINES ACTIONS\n';
  out += '- Relancer les leads prioritaires\n- Copier le message du jour\n- Programmer la prochaine étape\n';
  return out;
}
function buildLeadsCsv(){
  const st = StateM.get();
  const header = ['Nom','Source','Valeur','Statut','Dernier contact','Objection','Prochaine action','Échéance','Priorité','Notes'];
  const rows = st.leads.map(l=>[
    l.nom, l.source, l.valeur, l.statut, l.dernierContact, l.objection, l.prochaineAction, l.echeance, LeadManager.score(l).label, l.notes
  ].map(Utils.csvEscape).join(','));
  return '﻿' + header.join(',') + '\n' + rows.join('\n');
}

  openImport(){ document.getElementById('import-file-input').click(); },
  confirmReset(){
    UI.confirm({title:'Réinitialiser toutes tes données ?', message:'Cette action supprime définitivement tes leads, ton offre et ta séquence. Elle ne peut pas être annulée.', confirmLabel:'Réinitialiser', danger:true, onConfirm:()=>{
      StateM.reset();
      UI.toast('Données réinitialisées.');
      navigate('home');
      rerender();
    }});
  },
  skipOnboarding(){ endOnboarding(); },
  nextOnboarding(){ onboardIndex = Math.min(onboardIndex+1, ONBOARD_SLIDES.length-1); renderOnboarding(); },
  finishOnboarding(){ endOnboarding(); navigate('leads'); },
  closeModal(){ UI.closeModal(); },
  reloadApp(){ try{ location.reload(); }catch(e){ /* nothing more to do */ } }
};
LeadManager._raw = function(data){
  return Object.assign({id:Utils.uid(), createdAt:Date.now(), updatedAt:Date.now()}, data);
};

function openDayPicker(message, forcedDay){
  if(forcedDay){
    applyTemplateToDay(forcedDay, message);
    return;
  }
  const st = StateM.get();
  if(!st.sequence){ UI.toast("Génère d'abord ta séquence J0-J30."); return; }
  UI.modal({
    title:'Utiliser ce message dans ma séquence',
    bodyHtml: '<p class="hint">Choisis le jour à remplacer par ce message :</p>'+
      '<div class="chip-group">'+DAY_KEYS.map(d=>'<button type="button" class="chip" data-day-pick="'+d+'">'+d+'</button>').join('')+'</div>',
    actions:[{label:'Annuler', className:'secondary'}]
  });
  document.querySelectorAll('[data-day-pick]').forEach(b=>{
    b.addEventListener('click', ()=>{ applyTemplateToDay(b.dataset.dayPick, message); UI.closeModal(); });
  });
}
function applyTemplateToDay(day, message){
  const st = StateM.get();
  if(!st.sequence){ UI.toast("Génère d'abord ta séquence J0-J30."); return; }
  const apply = ()=>{
    st.sequence[day].message = message;
    st.sequence[day].manuallyEdited = true;
    StateM.save();
    UI.toast('Ajouté à '+day+'.');
    navigate('sequence');
    rerender();
  };
  if(st.sequence[day].manuallyEdited){
    UI.confirm({title:'Remplacer le message de '+day+' ?', message:'Ce message a déjà été modifié manuellement.', confirmLabel:'Remplacer', onConfirm:apply});
  } else apply();
}

function scrollToFormSoon(){ setTimeout(()=>{ const el=document.getElementById('lead-form-card'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 30); }
function rerender(){ renderRoute(currentHash); }

/* =========================================================
   GLOBAL EVENT DELEGATION
========================================================= */
document.addEventListener('click', function(e){
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    const map = {home:'home', system:'system', bonus:'bonus', exports:'exports'};
    navigate(map[navBtn.dataset.nav]);
    return;
  }
  const actionBtn = e.target.closest('[data-action]');
  if(actionBtn){
    const action = actionBtn.dataset.action;
    if(Actions[action]) Actions[action](actionBtn, e);
  }
});
document.addEventListener('change', function(e){
  const t = e.target;
  if(t.matches('[data-field]')){
    let val = t.value;
    Utils.setPath(StateM.get(), t.dataset.field, val);
    StateM.save();
  }
  if(t.matches('[data-day-notes]')){
    const st = StateM.get();
    if(st.sequence && st.sequence[t.dataset.dayNotes]){
      st.sequence[t.dataset.dayNotes].notes = t.value;
      StateM.save();
    }
  }
  if(t.matches('[data-action-select="moveLead"]')){
    Actions.moveLeadSelect(t);
  }
  if(t.matches('[data-field-live="leadStatutFilter"]')){ leadsUIState.filters.statut = t.value; rerender(); }
  if(t.matches('[data-field-live="leadSourceFilter"]')){ leadsUIState.filters.source = t.value; rerender(); }
  if(t.matches('[data-field-live="leadSort"]')){ leadsUIState.filters.sort = t.value; rerender(); }
  if(t.id==='import-file-input' && t.files && t.files[0]){
    const file = t.files[0];
    const reader = new FileReader();
    reader.onload = function(){
      let parsed = null;
      try{ parsed = JSON.parse(reader.result); }catch(err){ parsed = null; }
      if(!parsed || !Storage.isValidImport(parsed)){
        UI.toast("Cette sauvegarde semble invalide. Tes données actuelles n'ont pas été modifiées.");
        t.value = '';
        return;
      }
      UI.confirm({
        title:'Restaurer cette sauvegarde ?',
        message:'Cela remplacera toutes tes données actuelles par celles du fichier importé. Cette action ne peut pas être annulée.',
        confirmLabel:'Restaurer',
        danger:true,
        onConfirm:()=>{
          StateM.data = Storage.migrate(parsed);
          StateM.save();
          UI.toast('Données restaurées.');
          navigate('home');
          rerender();
        }
      });
      t.value = '';
    };
    reader.onerror = function(){
      UI.toast("Cette sauvegarde semble invalide. Tes données actuelles n'ont pas été modifiées.");
      t.value = '';
    };
    reader.readAsText(file);
  }
});
document.addEventListener('input', Utils.debounce(function(e){
  const t = e.target;
  if(t.matches('[data-field][data-numeric]')){
    Utils.setPath(StateM.get(), t.dataset.field, t.value);
    StateM.save();
  } else if(t.matches('[data-field]') && (t.tagName==='TEXTAREA')){
    Utils.setPath(StateM.get(), t.dataset.field, t.value);
    StateM.save();
  }
  if(t.matches('[data-field-live="leadSearch"]')){
    leadsUIState.filters.search = t.value;
    rerender();
    const el = document.querySelector('[data-field-live="leadSearch"]');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}, 250));
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.matches('#lf-nom, #lf-valeur')){
    e.preventDefault();
  }
});

/* =========================================================
   GLOBAL ERROR SAFETY NET
   A single failure anywhere (a bad localStorage entry, a rendering
   edge case) must never leave the whole app stuck on a blank screen.
========================================================= */
window.onerror = function(message, source, lineno, colno, error){
  console.warn('Erreur interceptée :', message, error);
  try{
    const app = document.getElementById('app');
    if(app && !app.innerHTML.trim()){
      app.innerHTML = '<div class="card"><div class="empty-state"><div class="ic">⚠️</div>'+
        '<p>Un problème est survenu pendant le chargement. Essaie de recharger la page.</p>'+
        '<div class="actions-row" style="justify-content:center;"><button type="button" class="btn" data-action="reloadApp">Recharger</button></div>'+
        '</div></div>';
    }
  }catch(e){ /* last resort: nothing more we can safely do */ }
  return false;
};
window.onunhandledrejection = function(event){
  console.warn('Promesse rejetée sans gestion :', event && event.reason);
};

/* =========================================================
   BOOTSTRAP
========================================================= */
function initApp(){
  try{
    StateM.init();
  }catch(e){
    console.warn('Initialisation des données impossible, démarrage avec un état vide.', e);
    StateM.data = defaultState();
  }
  try{
    window.addEventListener('hashchange', route);
  }catch(e){ /* navigation via clics reste fonctionnelle même si ceci échoue */ }
  try{
    if(!location.hash) location.hash = '#home';
  }catch(e){ /* non-fatal */ }
  try{
    route();
  }catch(e){
    console.warn('Premier rendu impossible.', e);
    const app = document.getElementById('app');
    if(app) app.innerHTML = '<div class="card"><div class="empty-state"><div class="ic">⚠️</div><p>Un problème est survenu pendant le chargement. Essaie de recharger la page.</p></div></div>';
  }
  try{
    if(!StateM.get().onboardingSeen){
      showOnboarding();
    }
  }catch(e){ /* l'app reste utilisable même sans onboarding */ }
}

function startWhenReady(){
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
}
startWhenReady();

})();
</script>
